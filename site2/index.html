<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бюро находок НГТУ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: #f8f9fa;
        }
        .sketch-border {
            border: 2px solid #d1d5db;
            border-radius: 8px;
        }
        .sketch-dashed {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
        }
        .card-hover {
            transition: border-color 0.2s ease;
        }
        .card-hover:hover {
            border-color: #9ca3af;
        }
        .input-field {
            background: #ffffff;
            border: 1.5px solid #d1d5db;
            color: #374151;
            border-radius: 6px;
        }
        .input-field:focus {
            outline: none;
            border-color: #6b7280;
        }
        .btn-primary {
            background: #374151;
            color: #ffffff;
            border-radius: 6px;
            transition: background 0.2s ease;
        }
        .btn-primary:hover {
            background: #1f2937;
        }
        .btn-secondary {
            background: #ffffff;
            color: #374151;
            border: 1.5px solid #d1d5db;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            border-color: #9ca3af;
            background: #f9fafb;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid;
        }
        .placeholder-img {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.3);
        }
        .fade-in {
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        .label {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b-2 border-gray-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 border-2 border-gray-400 rounded flex items-center justify-center">
                        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-sm font-bold text-gray-800">Бюро находок</h1>
                        <p class="text-[10px] text-gray-500">НГТУ им. Р.Е. Алексеева</p>
                    </div>
                </div>
                <button onclick="openAddModal()" class="btn-primary px-4 py-2 text-sm font-medium flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Добавить находку</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Title -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-4">
        <h2 class="text-2xl font-bold text-gray-800">Потерянные вещи</h2>
        <p class="text-sm text-gray-500 mt-1">Просматривайте найденные предметы в корпусах НГТУ</p>
    </section>

    <!-- Search -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-4">
        <div class="sketch-border bg-white p-3 flex gap-2">
            <div class="flex-1 relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Поиск..." 
                    class="w-full pl-10 pr-3 py-2 input-field text-sm"
                    oninput="filterItems()">
            </div>
            <button onclick="filterItems()" class="btn-primary px-4 py-2 text-sm font-medium">
                Найти
            </button>
        </div>
    </section>

    <!-- Filters -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-6">
        <div class="sketch-border bg-white p-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <div>
                    <label class="label mb-1.5 block">Место</label>
                    <select id="filterLocation" onchange="filterItems()" class="w-full px-3 py-2 input-field text-sm">
                        <option value="">Все места</option>
                    </select>
                </div>
                <div>
                    <label class="label mb-1.5 block">Категория</label>
                    <select id="filterCategory" onchange="filterItems()" class="w-full px-3 py-2 input-field text-sm">
                        <option value="">Все категории</option>
                        <option value="documents">Документы</option>
                        <option value="electronics">Электроника</option>
                        <option value="clothing">Одежда</option>
                        <option value="accessories">Аксессуары</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                <div>
                    <label class="label mb-1.5 block">Дата (от)</label>
                    <input type="date" id="filterDateFrom" onchange="filterItems()" class="w-full px-3 py-2 input-field text-sm">
                </div>
                <div>
                    <label class="label mb-1.5 block">Дата (до)</label>
                    <input type="date" id="filterDateTo" onchange="filterItems()" class="w-full px-3 py-2 input-field text-sm">
                </div>
            </div>
            <div class="flex justify-end mt-3">
                <button onclick="resetFilters()" class="text-xs text-gray-500 hover:text-gray-700 font-medium flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Сбросить фильтры
                </button>
            </div>
        </div>
    </section>

    <!-- Items Grid -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-10">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-semibold text-gray-700">Найденные вещи</h3>
            <span class="text-xs text-gray-500" id="resultsCount">0 результатов</span>
        </div>
        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
        <div id="emptyState" class="hidden text-center py-12">
            <svg class="w-16 h-16 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p class="text-gray-600 text-sm font-medium">Ничего не найдено</p>
            <p class="text-gray-400 text-xs mt-1">Попробуйте изменить параметры поиска</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="border-t-2 border-gray-200 bg-white py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-gray-500">
            <p>© 2026 Бюро находок НГТУ им. Р.Е. Алексеева</p>
        </div>
    </footer>

    <!-- Add Modal -->
    <div id="addModal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto fade-in border-2 border-gray-300">
            <div class="p-6">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-lg font-bold text-gray-800">Добавить находку</h3>
                    <button onclick="closeAddModal()" class="w-8 h-8 rounded flex items-center justify-center hover:bg-gray-100 transition-all">
                        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <form id="addForm" onsubmit="addItem(event)" class="space-y-4">
                    <div>
                        <label class="label mb-1.5 block">Фото предмета</label>
                        <div id="photoPreview" class="w-full h-32 sketch-dashed flex items-center justify-center cursor-pointer hover:border-gray-400 transition-all overflow-hidden" onclick="document.getElementById('photoInput').click()">
                            <div id="photoPlaceholder" class="text-center">
                                <svg class="w-8 h-8 text-gray-400 mx-auto mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                                <p class="text-xs text-gray-500">Нажмите для загрузки</p>
                            </div>
                            <img id="photoImg" class="hidden w-full h-full object-cover" alt="">
                        </div>
                        <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                    </div>
                    <div>
                        <label class="label mb-1.5 block">Название предмета *</label>
                        <input type="text" id="itemName" required placeholder="Например: Ключи с брелоком" class="w-full px-3 py-2 input-field text-sm">
                    </div>
                    <div>
                        <label class="label mb-1.5 block">Категория *</label>
                        <select id="itemCategory" required class="w-full px-3 py-2 input-field text-sm">
                            <option value="">Выберите категорию</option>
                            <option value="documents">Документы</option>
                            <option value="electronics">Электроника</option>
                            <option value="clothing">Одежда</option>
                            <option value="accessories">Аксессуары</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>
                    <div>
                        <label class="label mb-1.5 block">Где нашли *</label>
                        <input type="text" id="itemLocation" required placeholder="Например: Корпус 3, ауд. 412" class="w-full px-3 py-2 input-field text-sm">
                    </div>
                    <div>
                        <label class="label mb-1.5 block">Когда нашли *</label>
                        <input type="datetime-local" id="itemDate" required class="w-full px-3 py-2 input-field text-sm">
                    </div>
                    <div>
                        <label class="label mb-1.5 block">Где можно забрать *</label>
                        <input type="text" id="itemPickup" required placeholder="Например: Охрана на 1 этаже" class="w-full px-3 py-2 input-field text-sm">
                    </div>
                    <div>
                        <label class="label mb-1.5 block">Контакт для связи</label>
                        <input type="text" id="itemContact" placeholder="Телефон или email" class="w-full px-3 py-2 input-field text-sm">
                    </div>
                    <div>
                        <label class="label mb-1.5 block">Описание</label>
                        <textarea id="itemDescription" rows="3" placeholder="Дополнительные детали..." class="w-full px-3 py-2 input-field text-sm resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full btn-primary py-2.5 text-sm font-medium">
                        Добавить находку
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto fade-in border-2 border-gray-300">
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 right-6 z-50 bg-gray-800 text-white px-5 py-2.5 rounded-lg shadow-lg flex items-center gap-2 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        <span id="toastMessage">Готово!</span>
    </div>

    <script>
        const STORAGE_KEYS = {
            items: 'lostAndFound_items_v2'
        };

        const DEFAULT_ITEMS = [
            {
                id: 1,
                name: 'Ключи с брелоком НГТУ',
                category: 'accessories',
                location: 'Корпус 3, 2 этаж, у лифта',
                date: '2026-11-03T14:30',
                pickup: 'Охрана, 1 этаж корпуса 3',
                contact: '+7 (913) 123-45-67',
                description: 'Связка из 4 ключей с синим брелоком в виде логотипа НГТУ.',
                photo: null,
                createdAt: '2026-11-03T15:00:00'
            },
            {
                id: 2,
                name: 'Студенческий билет',
                category: 'documents',
                location: 'Корпус 1, ауд. 215',
                date: '2026-11-04T10:15',
                pickup: 'Деканат, корпус 1, каб. 105',
                contact: 'dekanat@nstu.ru',
                description: 'Студенческий билет ИТИ, 2 курс. Найден на парте во время лекции.',
                photo: null,
                createdAt: '2026-11-04T11:00:00'
            },
            {
                id: 3,
                name: 'Беспроводные наушники AirPods',
                category: 'electronics',
                location: 'Библиотека НГТУ, читальный зал',
                date: '2026-11-02T16:45',
                pickup: 'Ресепшн библиотеки',
                contact: '+7 (913) 987-65-43',
                description: 'Белый чехол AirPods Pro, без гравировки. Заряд примерно 60%.',
                photo: null,
                createdAt: '2026-11-02T17:30:00'
            },
            {
                id: 4,
                name: 'Чёрный зонт-автомат',
                category: 'clothing',
                location: 'Корпус 5, гардероб',
                date: '2026-11-01T12:00',
                pickup: 'Гардероб корпуса 5',
                contact: '',
                description: 'Складной зонт чёрного цвета с деревянной ручкой.',
                photo: null,
                createdAt: '2026-11-01T13:00:00'
            },
            {
                id: 5,
                name: 'Калькулятор Casio fx-991',
                category: 'electronics',
                location: 'Корпус 3, ауд. 412',
                date: '2026-11-04T09:00',
                pickup: 'Кафедра высшей математики, корп. 3, каб. 410',
                contact: '+7 (383) 346-00-00',
                description: 'Научный калькулятор Casio в синем чехле.',
                photo: null,
                createdAt: '2026-11-04T09:30:00'
            },
            {
                id: 6,
                name: 'Записная книжка Moleskine',
                category: 'other',
                location: 'Столовая корпуса 2',
                date: '2026-11-03T13:20',
                pickup: 'Администрация корпуса 2, каб. 101',
                contact: '',
                description: 'Чёрная записная книжка формата A5 с резинкой.',
                photo: null,
                createdAt: '2026-11-03T14:00:00'
            }
        ];

        let items = [];
        let currentPhoto = null;

        const categoryLabels = {
            documents: 'Документы',
            electronics: 'Электроника',
            clothing: 'Одежда',
            accessories: 'Аксессуары',
            other: 'Другое'
        };

        const categoryColors = {
            documents: 'bg-purple-50 text-purple-700 border-purple-200',
            electronics: 'bg-blue-50 text-blue-700 border-blue-200',
            clothing: 'bg-pink-50 text-pink-700 border-pink-200',
            accessories: 'bg-amber-50 text-amber-700 border-amber-200',
            other: 'bg-gray-50 text-gray-700 border-gray-200'
        };

        const categoryIcons = {
            documents: `<svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`,
            electronics: `<svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`,
            clothing: `<svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>`,
            accessories: `<svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>`,
            other: `<svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>`
        };

        function loadData() {
            const stored = localStorage.getItem(STORAGE_KEYS.items);
            if (stored) {
                items = JSON.parse(stored);
            } else {
                items = DEFAULT_ITEMS;
                saveItems();
            }
            updateLocationFilter();
            renderItems();
        }

        function saveItems() {
            localStorage.setItem(STORAGE_KEYS.items, JSON.stringify(items));
        }

        function updateLocationFilter() {
            const select = document.getElementById('filterLocation');
            const locations = [...new Set(items.map(i => i.location))].sort();
            select.innerHTML = '<option value="">Все места</option>';
            locations.forEach(loc => {
                select.innerHTML += `<option value="${loc}">${loc}</option>`;
            });
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (hours < 1) return 'Только что';
            if (hours < 24) return `${hours} ч. назад`;
            if (days === 1) return 'Вчера';
            if (days < 7) return `${days} дн. назад`;
            
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function formatFullDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ru-RU', { 
                day: 'numeric', month: 'long', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function renderItems() {
            const filtered = getFilteredItems();
            const grid = document.getElementById('itemsGrid');
            const empty = document.getElementById('emptyState');
            const count = document.getElementById('resultsCount');

            const plural = filtered.length === 1 ? 'результат' : filtered.length < 5 ? 'результата' : 'результатов';
            count.textContent = `${filtered.length} ${plural}`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = filtered.map(item => `
                <div class="sketch-border bg-white overflow-hidden card-hover cursor-pointer" onclick="openDetail(${item.id})">
                    <div class="relative">
                        ${item.photo 
                            ? `<img src="${item.photo}" class="w-full h-40 object-cover" alt="${item.name}">`
                            : `<div class="w-full h-40 placeholder-img">
                                ${categoryIcons[item.category]}
                               </div>`
                        }
                        <div class="absolute top-2 left-2">
                            <span class="badge ${categoryColors[item.category]}">${categoryLabels[item.category]}</span>
                        </div>
                    </div>
                    <div class="p-4">
                        <h4 class="font-semibold text-gray-800 text-sm mb-2 line-clamp-1">${item.name}</h4>
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-1.5 text-xs text-gray-600">
                                <svg class="w-3.5 h-3.5 flex-shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                                <span class="truncate">${item.location}</span>
                            </div>
                            <div class="flex items-center gap-1.5 text-xs text-gray-600">
                                <svg class="w-3.5 h-3.5 flex-shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                <span>${formatDate(item.date)}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getFilteredItems() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const location = document.getElementById('filterLocation').value;
            const category = document.getElementById('filterCategory').value;
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;

            return items.filter(item => {
                if (search && !item.name.toLowerCase().includes(search) && 
                    !item.description.toLowerCase().includes(search) &&
                    !item.location.toLowerCase().includes(search)) {
                    return false;
                }
                if (location && item.location !== location) return false;
                if (category && item.category !== category) return false;
                if (dateFrom) {
                    const itemDate = new Date(item.date).toISOString().split('T')[0];
                    if (itemDate < dateFrom) return false;
                }
                if (dateTo) {
                    const itemDate = new Date(item.date).toISOString().split('T')[0];
                    if (itemDate > dateTo) return false;
                }
                return true;
            }).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }

        function filterItems() {
            renderItems();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterLocation').value = '';
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            renderItems();
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            currentPhoto = null;
            document.getElementById('photoImg').classList.add('hidden');
            document.getElementById('photoPlaceholder').classList.remove('hidden');
            document.getElementById('addForm').reset();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentPhoto = e.target.result;
                document.getElementById('photoImg').src = currentPhoto;
                document.getElementById('photoImg').classList.remove('hidden');
                document.getElementById('photoPlaceholder').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        function addItem(event) {
            event.preventDefault();
            
            const newItem = {
                id: Date.now(),
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                location: document.getElementById('itemLocation').value,
                date: document.getElementById('itemDate').value,
                pickup: document.getElementById('itemPickup').value,
                contact: document.getElementById('itemContact').value,
                description: document.getElementById('itemDescription').value,
                photo: currentPhoto,
                createdAt: new Date().toISOString()
            };

            items.push(newItem);
            saveItems();
            updateLocationFilter();
            renderItems();
            closeAddModal();
            showToast('Находка добавлена');
        }

        function openDetail(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <div class="relative">
                    ${item.photo 
                        ? `<img src="${item.photo}" class="w-full h-56 object-cover" alt="${item.name}">`
                        : `<div class="w-full h-56 placeholder-img flex items-center justify-center">
                            ${categoryIcons[item.category]}
                           </div>`
                    }
                    <button onclick="closeDetailModal()" class="absolute top-3 right-3 w-8 h-8 rounded bg-white/90 flex items-center justify-center hover:bg-white transition-all shadow">
                        <svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="p-5">
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <h3 class="text-lg font-bold text-gray-800">${item.name}</h3>
                        <span class="badge ${categoryColors[item.category]} flex-shrink-0">${categoryLabels[item.category]}</span>
                    </div>
                    
                    <div class="space-y-3 mb-5">
                        <div class="flex items-start gap-2.5">
                            <div class="w-8 h-8 border border-gray-300 rounded flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                                </svg>
                            </div>
                            <div>
                                <p class="label">Где нашли</p>
                                <p class="text-sm text-gray-800 font-medium">${item.location}</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-2.5">
                            <div class="w-8 h-8 border border-gray-300 rounded flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                            <div>
                                <p class="label">Когда нашли</p>
                                <p class="text-sm text-gray-800 font-medium">${formatFullDate(item.date)}</p>
                            </div>
                        </div>
                        <div class="flex items-start gap-2.5">
                            <div class="w-8 h-8 border border-gray-300 rounded flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                                </svg>
                            </div>
                            <div>
                                <p class="label">Где забрать</p>
                                <p class="text-sm text-gray-800 font-medium">${item.pickup}</p>
                            </div>
                        </div>
                        ${item.contact ? `
                        <div class="flex items-start gap-2.5">
                            <div class="w-8 h-8 border border-gray-300 rounded flex items-center justify-center flex-shrink-0">
                                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                </svg>
                            </div>
                            <div>
                                <p class="label">Контакт</p>
                                <p class="text-sm text-gray-800 font-medium">${item.contact}</p>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                    
                    ${item.description ? `
                    <div class="border border-gray-200 rounded p-3 mb-5 bg-gray-50">
                        <p class="label mb-1.5">Описание</p>
                        <p class="text-sm text-gray-700">${item.description}</p>
                    </div>
                    ` : ''}

                    <button onclick="closeDetailModal()" class="w-full btn-secondary py-2.5 text-sm font-medium">
                        Закрыть
                    </button>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) closeDetailModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeAddModal();
                closeDetailModal();
            }
        });

        loadData();
    </script>
</body>
</html>
